    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow Use Case Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --accent-start: hsl(185, 100%, 50%);
            --accent-end: hsl(260, 100%, 70%);
            --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
            --bg-color-base: #10131a;
            --card-bg: #242933;
            --card-border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            background-color: var(--bg-color-base);
            background-image:
                radial-gradient(at 10% 10%, hsla(185, 100%, 50%, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 85%, hsla(260, 100%, 70%, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 40%, hsla(220, 70%, 55%, 0.1) 0px, transparent 50%);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background-attachment: fixed;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color-base); }
        ::-webkit-scrollbar-thumb { background: var(--accent-end); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-start); }
        
        /* Glassmorphism Base for modals */
        .glass-card {
            background: rgba(36, 41, 51, 0.7);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--card-border);
        }
        
        /* General Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.4s ease-out forwards; }

        /* Header & Icon Gradient Text */
        .gradient-text, .icon-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        
        /* New Gradient Border Card Style */
        .showcase-card {
            background: var(--card-bg);
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            z-index: 1;
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        .showcase-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: -1;
            margin: -1px; /* Grow border */
            border-radius: inherit;
            background: var(--card-border);
            transition: background 0.4s ease;
        }
        .showcase-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 20px hsla(185, 100%, 50%, 0.2), 0 0 30px hsla(260, 100%, 70%, 0.2);
        }
        .showcase-card:hover::before {
            background: var(--accent-gradient);
        }
        
        /* Pulsing Glow for Edit Mode */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 2px hsla(185, 100%, 50%, 0.4); }
            50% { box-shadow: 0 0 0 3px hsla(185, 100%, 50%, 0.8); }
        }
        
        /* Button Press Animation */
        .pressable {
            transition: transform 0.1s ease;
        }
        .pressable:active {
            transform: scale(0.97);
        }
        
        /* Glowing Demystify Button */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes spin {
            to { --angle: 360deg; }
        }
        .glowing-circle-container {
            position: relative;
            padding: 2px; /* Border thickness */
            border-radius: 9999px;
            display: inline-block;
            background: conic-gradient(from var(--angle), 
                hsla(260, 100%, 70%, 0), 
                var(--accent-end), 
                var(--accent-start), 
                hsla(185, 100%, 50%, 0.5), 
                hsla(185, 100%, 50%, 0));
            animation: spin 4s linear infinite;
            filter: drop-shadow(0 0 5px var(--accent-start)) drop-shadow(0 0 10px var(--accent-end));
        }

        /* Tag Accent Style */
        .tag-accent {
            background: linear-gradient(135deg, hsla(185, 100%, 50%, 0.1), hsla(260, 100%, 70%, 0.1));
            color: var(--accent-start);
            border: 1px solid hsla(185, 100%, 50%, 0.4);
        }

        /* Accent Gradient Button */
        .btn-accent {
            background-image: var(--accent-gradient);
            color: white;
            border: none;
        }
        .btn-accent:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px -3px var(--accent-start), 0 0 25px -8px var(--accent-end);
        }
    </style>
