
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow Use Case Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --accent-start: hsl(170, 80%, 45%);
            --accent-end: hsl(80, 70%, 55%);
            --accent-gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));

            /* Dark Theme (Default) */
            --bg-color-base: #10131a;
            --card-bg: #242933;
            --card-bg-translucent: rgba(36, 41, 51, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --bg-glow-1: hsla(170, 80%, 45%, 0.15);
            --bg-glow-2: hsla(80, 70%, 55%, 0.2);
            --bg-glow-3: hsla(220, 70%, 55%, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.25);
            --glow-shadow-1: hsla(170, 80%, 45%, 0.2);
            --glow-shadow-2: hsla(80, 70%, 55%, 0.2);
            --section-bg: hsla(170, 80%, 45%, 0.05);
            --section-border: hsla(170, 80%, 45%, 0.1);
        }
        
        body {
            background-color: var(--bg-color-base);
            background-image: 
                radial-gradient(at 10% 10%, var(--bg-glow-1) 0px, transparent 40%),
                radial-gradient(at 90% 20%, var(--bg-glow-3) 0px, transparent 50%),
                radial-gradient(at 20% 80%, var(--bg-glow-2) 0px, transparent 50%);
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            background-attachment: fixed;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color-base); }
        ::-webkit-scrollbar-thumb { background: var(--accent-end); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-start); }
        
        /* Glassmorphism Base for modals */
        .glass-card {
            background: var(--card-bg-translucent);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--card-border);
            transition: background 0.3s ease, border 0.3s ease;
        }
        
        /* General Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
        .animate-fade-in-down { animation: fadeInDown 0.5s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.4s ease-out forwards; }

        /* Header & Icon Gradient Text */
        .gradient-text, .icon-gradient {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }
        
        /* New Gradient Border Card Style */
        .showcase-card {
            background: var(--card-bg);
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            position: relative;
            z-index: 1;
            border: 1px solid var(--card-border);
            overflow: hidden; /* This is key! */
        }

        .showcase-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 4px;
            background: var(--accent-gradient);
            box-shadow: 0 0 6px hsla(170, 80%, 45%, 0.5), 0 0 10px hsla(170, 80%, 45%, 0.4);
            opacity: 0.6;
            transition: opacity 0.3s ease, box-shadow 0.3s ease, height 0.3s ease;
            z-index: 2;
        }

        .showcase-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -10px var(--shadow-color);
            border-color: hsla(170, 80%, 45%, 0.3);
        }

        .showcase-card:hover::before {
            opacity: 0.8;
            height: 5px;
            box-shadow: 0 0 10px hsla(170, 80%, 45%, 0.6), 0 0 15px hsla(80, 70%, 55%, 0.5);
        }

        /* Pulsing Glow for Edit Mode */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 2px hsla(170, 80%, 45%, 0.4); }
            50% { box-shadow: 0 0 0 3px hsla(170, 80%, 45%, 0.8); }
        }
        
        /* Button Press Animation */
        .pressable {
            transition: transform 0.1s ease;
        }
        .pressable:active {
            transform: scale(0.97);
        }
        
        /* Glowing Demystify Button */
        @keyframes subtle-border-glow {
            0%, 100% {
                box-shadow: 0 0 5px var(--accent-start), 0 0 10px var(--accent-end), inset 0 0 5px rgba(0,0,0,0.5);
            }
            50% {
                box-shadow: 0 0 8px var(--accent-start), 0 0 15px var(--accent-end), inset 0 0 5px rgba(0,0,0,0.5);
            }
        }
        .glowing-circle-container {
            position: relative;
            padding: 2px; /* Border thickness */
            border-radius: 9999px;
            display: inline-block;
            background: var(--accent-gradient);
            animation: subtle-border-glow 3s linear infinite;
        }

        /* Tag Accent Style */
        .tag-accent {
            background: linear-gradient(135deg, hsla(170, 80%, 45%, 0.1), hsla(80, 70%, 55%, 0.1));
            color: var(--accent-start);
            border: 1px solid hsla(170, 80%, 45%, 0.4);
        }

        /* Accent Gradient Button */
        .btn-accent {
            background-image: var(--accent-gradient);
            color: #10131a;
            border: none;
        }
        .btn-accent:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px -3px var(--accent-start), 0 0 25px -8px var(--accent-end);
        }
        
        /* Themed Input for Edit Panel */
        .themed-input {
            background-color: rgba(0,0,0,0.3);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
        }
        .themed-input:focus {
            border-color: var(--accent-start) !important;
            outline: none;
            box-shadow: 0 0 0 2px hsla(170, 80%, 45%, 0.3);
        }

        /* Card Background Icon */
        .card-bg-icon {
            position: absolute;
            bottom: -20px;
            right: -20px;
            font-size: 120px;
            color: var(--accent-start);
            opacity: 0.06;
            z-index: 0;
            transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.4s ease;
            transform: rotate(15deg);
        }

        .showcase-card:hover .card-bg-icon {
            transform: scale(1.15) rotate(5deg);
            opacity: 0.1;
        }
        
        /* New Header Styles */
        .page-header {
            padding: 1rem 0;
            position: relative;
        }
        .header-title {
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, #FFFFFF 30%, #90F2D0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .header-subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 45ch;
            margin: 0 auto;
            line-height: 1.6;
        }
        .header-subtitle span {
            color: hsl(150, 70%, 75%);
            text-decoration: underline;
            text-decoration-color: hsla(150, 60%, 50%, 0.5);
            text-underline-offset: 4px;
        }
        .edit-page-button-container {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
    </style>
